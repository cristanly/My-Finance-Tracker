<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Finance Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9f5ed;
            border-radius: 6px;
            text-align: center;
            color: #2e7d32;
            font-size: 20px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Peso Tracker</h2>
    
    <div class="input-group">
        <label for="amount">Ilagay ang Halaga:</label>
        <input type="number" id="amount" placeholder="0.00" oninput="formatPeso()">
    </div>

    <div class="result" id="resultText">
        ₱0.00
    </div>
</div>

<script>
    function formatPeso() {
        const amount = document.getElementById('amount').value;
        const resultText = document.getElementById('resultText');

        if (!amount || amount === "") {
            resultText.innerText = "₱0.00";
            return;
        }

        const num = parseFloat(amount);
        resultText.innerText = `₱${num.toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }
</script>

</body>
</html>
