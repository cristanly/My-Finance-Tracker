<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Finance Tracker - PHP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tab-content { animation: fadeInSlide 0.3s ease-in-out forwards; }
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- App Header -->
        <header id="app-header" class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-200/85">
            <div>
                <div class="flex items-center gap-3">
                    <h1 id="welcome-title" class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900">Hi, User! 👋</h1>
                    <button type="button" onclick="editUsername()" id="edit-name-btn" class="w-9 h-9 flex items-center justify-center text-cyan-600 hover:text-cyan-700 bg-cyan-50 hover:bg-cyan-100 rounded-xl transition shadow-sm border border-cyan-100" title="Edit Name">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>
                </div>
                <p id="header-desc" class="text-sm text-slate-500 mt-1">Track your salary, wallets, budget limits, and expenses in Philippine Pesos.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end flex-wrap">
                <div class="flex items-center bg-emerald-50 border border-emerald-200 rounded-xl px-3.5 py-2 shadow-sm">
                    <span class="text-xs font-semibold text-emerald-700"><i class="fa-solid fa-peso-sign mr-1"></i> Currency: Philippine Peso (₱)</span>
                </div>
                <div class="relative">
                    <button type="button" onclick="toggleSettingsDropdown(event)" id="gear-btn" class="w-10 h-10 flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl transition border border-slate-200 shadow-sm" title="Settings & Backup">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <div id="settings-dropdown" class="hidden absolute right-0 mt-2 w-52 bg-white border border-slate-200 rounded-2xl shadow-xl py-2 z-50">
                        <div class="px-4 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Data Management</div>
                        <button type="button" onclick="exportData()" class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-600 hover:bg-cyan-50 hover:text-cyan-600 transition flex items-center gap-2">
                            <i class="fa-solid fa-download w-4 text-cyan-500"></i> Export Backup
                        </button>
                        <label class="w-full text-left px-4 py-2.5 text-xs font-medium text-slate-600 hover:bg-emerald-50 hover:text-emerald-600 transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-upload w-4 text-emerald-500"></i> Import Backup
                            <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                        </label>
                        <div class="h-px bg-slate-100 my-1"></div>
                        <button type="button" onclick="resetAllData()" class="w-full text-left px-4 py-2.5 text-xs font-medium text-pink-600 hover:bg-pink-50 transition flex items-center gap-2">
                            <i class="fa-solid fa-trash-can w-4 text-pink-500"></i> Reset Data
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div id="nav-container" class="flex overflow-x-auto space-x-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200/80 mb-8">
            <button type="button" onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i> Dashboard</button>
            <button type="button" onclick="switchTab('transactions')" id="btn-transactions" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-wallet mr-1.5"></i> Transactions</button>
            <button type="button" onclick="switchTab('wallets')" id="btn-wallets" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-credit-card mr-1.5"></i> Accounts</button>
            <button type="button" onclick="switchTab('budgets')" id="btn-budgets" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-bullseye mr-1.5"></i> Budget Limits</button>
            <button type="button" onclick="switchTab('credit')" id="btn-credit" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-file-invoice-dollar mr-1.5"></i> Loans</button>
            <button type="button" onclick="switchTab('savings')" id="btn-savings" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-piggy-bank mr-1.5"></i> Savings Goals</button>
            <button type="button" onclick="switchTab('recurring')" id="btn-recurring" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap"><i class="fa-solid fa-receipt mr-1.5"></i> Recurring Bills</button>
        </div>

        <!-- TAB CONTENT: TRANSACTIONS -->
        <div id="tab-transactions" class="tab-content grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-emerald-600">Add Transaction</h2>
                <form id="form-transaction" onsubmit="addEntry(event, 'transaction')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Description</label>
                        <input type="text" id="t-desc" required placeholder="e.g., Grocery, Salary" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 focus:outline-none text-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Amount (₱)</label>
                        <input type="text" id="t-amount" required placeholder="0.00" oninput="formatInputAmount(this)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 focus:outline-none text-slate-800">
                    </div>
                    
                    <!-- INCOME & EXPENSE BUTTONS -->
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Type</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="btn-type-income" class="py-2 px-3 rounded-xl text-xs font-bold transition border border-emerald-300 bg-emerald-500 text-white shadow-sm">
                                <i class="fa-solid fa-arrow-down-long mr-1"></i> Income
                            </button>
                            <button type="button" id="btn-type-expense" class="py-2 px-3 rounded-xl text-xs font-bold transition border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100">
                                <i class="fa-solid fa-arrow-up-long mr-1"></i> Expense
                            </button>
                        </div>
                        <input type="hidden" id="t-type" value="income">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Category</label>
                        <select id="t-category" onchange="handleCategoryChange('t')" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 focus:outline-none text-slate-800 cursor-pointer">
                            <option value="Salary">Salary / Sahod</option>
                            <option value="Food">Food & Groceries</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Transport">Transportation</option>
                            <option value="Shopping">Shopping & Wants</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">Add Transaction</button>
                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPT PARA SA BUTTONS NA SIGURADONG GAGANA -->
    <script>
        function setTransactionType(type) {
            const inputType = document.getElementById('t-type');
            if (inputType) inputType.value = type;

            const btnIncome = document.getElementById('btn-type-income');
            const btnExpense = document.getElementById('btn-type-expense');

            if (!btnIncome || !btnExpense) return;

            if (type === 'income') {
                btnIncome.className = "py-2 px-3 rounded-xl text-xs font-bold transition border border-emerald-300 bg-emerald-500 text-white shadow-sm";
                btnExpense.className = "py-2 px-3 rounded-xl text-xs font-bold transition border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100";
            } else {
                btnExpense.className = "py-2 px-3 rounded-xl text-xs font-bold transition border border-pink-300 bg-pink-500 text-white shadow-sm";
                btnIncome.className = "py-2 px-3 rounded-xl text-xs font-bold transition border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100";
            }
        }

        // Event listeners para siguradong gagana kahit i-click
        document.addEventListener('DOMContentLoaded', () => {
            const btnIncome = document.getElementById('btn-type-income');
            const btnExpense = document.getElementById('btn-type-expense');

            if (btnIncome) {
                btnIncome.addEventListener('click', () => setTransactionType('income'));
            }
            if (btnExpense) {
                btnExpense.addEventListener('click', () => setTransactionType('expense'));
            }
        });
    </script>
</body>
</html>
