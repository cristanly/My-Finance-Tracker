<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Finance Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- App Header -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Finance Tracker</h1>
                <p class="text-sm text-slate-500">Manage your income and expenses effortlessly.</p>
            </div>
            <button onclick="resetData()" class="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-200 transition">
                <i class="fa-solid fa-trash-can mr-1"></i> Reset Data
            </button>
        </header>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-slate-500">Total Balance</p>
                <h2 id="net-balance" class="text-2xl font-bold text-slate-900 mt-1">$0.00</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-slate-500">Total Income</p>
                <h2 id="total-income" class="text-2xl font-bold text-emerald-600 mt-1">+$0.00</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-slate-500">Total Expenses</p>
                <h2 id="total-expense" class="text-2xl font-bold text-rose-600 mt-1">-$0.00</h2>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Add Transaction Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-slate-900">Add Transaction</h2>
                <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
                        <input type="text" id="description" required placeholder="e.g., Grocery Shopping" 
                            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" 
                            class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Type</label>
                        <select id="type" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-xl text-sm hover:bg-indigo-700 transition">
                        Add Transaction
                    </button>
                </form>
            </div>

            <!-- Transaction History List -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:col-span-2">
                <h2 class="text-lg font-semibold mb-4 text-slate-900">Transaction History</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400">
                                <th class="pb-3">Description</th>
                                <th class="pb-3">Type</th>
                                <th class="pb-3 text-right">Amount</th>
                                <th class="pb-3 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list" class="text-sm divide-y divide-slate-50">
                            <!-- Transactions populated via JS -->
                        </tbody>
                    </table>
                    <p id="empty-state" class="text-center text-slate-400 text-sm py-8 hidden">No transactions recorded yet.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function saveAndRefresh() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            init();
        }

        function addTransaction(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            const newTransaction = {
                id: Date.now(),
                description,
                amount,
                type
            };

            transactions.push(newTransaction);
            saveAndRefresh();
            document.getElementById('transaction-form').reset();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRefresh();
        }

        function resetData() {
            if (confirm("Are you sure you want to clear all transaction history?")) {
                transactions = [];
                saveAndRefresh();
            }
        }

        function init() {
            const listEl = document.getElementById('transaction-list');
            const emptyState = document.getElementById('empty-state');
            const netBalanceEl = document.getElementById('net-balance');
            const totalIncomeEl = document.getElementById('total-income');
            const totalExpenseEl = document.getElementById('total-expense');

            listEl.innerHTML = '';

            let income = 0;
            let expense = 0;

            if (transactions.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                transactions.forEach(t => {
                    if (t.type === 'income') {
                        income += t.amount;
                    } else {
                        expense += t.amount;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="py-3 font-medium text-slate-800">${t.description}</td>
                        <td class="py-3">
                            <span class="px-2.5 py-1 text-xs rounded-full font-medium ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                                ${t.type.charAt(0).toUpperCase() + t.type.slice(1)}
                            </span>
                        </td>
                        <td class="py-3 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">
                            ${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}
                        </td>
                        <td class="py-3 text-center">
                            <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-600 transition">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </td>
                    `;
                    listEl.appendChild(row);
                });
            }

            const net = income - expense;
            netBalanceEl.textContent = `${net < 0 ? '-' : ''}$${Math.abs(net).toFixed(2)}`;
            totalIncomeEl.textContent = `+$${income.toFixed(2)}`;
            totalExpenseEl.textContent = `-$${expense.toFixed(2)}`;
        }

        // Run on load
        init();
    </script>
</body>
</html>
